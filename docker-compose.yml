x-dotnet-health: &dotnet-health
  test:
    - CMD
    - bash
    - -c
    - >-
      exec 3<>/dev/tcp/127.0.0.1/8080 &&
      printf 'GET /health HTTP/1.0\r\n\r\n' >&3 &&
      head -n1 <&3 | grep -q ' 200'
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

x-messaging: &messaging-env
  Messaging__ConnectionString: amqp://guest:guest@rabbitmq:5672

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  inventory-api:
    build: { context: ., dockerfile: src/Inventory.Api/Dockerfile }
    environment:
      ConnectionStrings__Inventory: Host=postgres;Database=inventory;Username=postgres;Password=postgres
      Demo__DelayMs: "0"
      Demo__ErrorRate: "0"
    ports: ["5102:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: *dotnet-health

  catalog-api:
    build: { context: ., dockerfile: src/Catalog.Api/Dockerfile }
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=catalog;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Services__InventoryUrl: http://inventory-api:8080
      Admin__ApiKey: dev-admin-key
      Cache__TtlSeconds: "60"
    deploy: { replicas: 2 }  # nginx round-robins across both; no host port
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      inventory-api: { condition: service_healthy }
    healthcheck: *dotnet-health

  order-api:
    build: { context: ., dockerfile: src/Order.Api/Dockerfile }
    environment:
      <<: *messaging-env
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=postgres;Password=postgres
      Services__InventoryUrl: http://inventory-api:8080
      Orders__PendingTimeoutMinutes: "5"
      Orders__SweepIntervalSeconds: "30"
    ports: ["5103:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      inventory-api: { condition: service_healthy }
    healthcheck: *dotnet-health

  worker:
    build: { context: ., dockerfile: src/Worker/Dockerfile }
    environment:
      <<: *messaging-env
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=postgres;Password=postgres
      Services__InventoryUrl: http://inventory-api:8080
      Payment__FailureRate: "0.1"
      Demo__NotificationErrorRate: "0"
    depends_on:
      order-api: { condition: service_healthy }  # order-api runs the orders migrations
      rabbitmq: { condition: service_healthy }
      inventory-api: { condition: service_healthy }

  web:
    build: { context: src/web }  # reached through the gateway; no host port

  gateway:
    image: nginx:1.28-alpine
    ports: ["8080:8080"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      catalog-api: { condition: service_healthy }
      inventory-api: { condition: service_healthy }
      order-api: { condition: service_healthy }
      web: { condition: service_started }

volumes:
  pgdata:
