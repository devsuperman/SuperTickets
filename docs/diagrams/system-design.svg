<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" width="1180" height="780" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SuperTickets system design</title>
  <desc>Browser to nginx gateway to Catalog, Inventory and Order services; Order publishes through an outbox to RabbitMQ; Worker consumes payment and notification queues.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .l{font-size:11px;fill:#334155}
      .h{font-size:13px;font-weight:700;fill:#0f172a}
      .svc{fill:#dbeafe;stroke:#2563eb;stroke-width:1.5}
      .db{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}
      .mq{fill:#ffedd5;stroke:#ea580c;stroke-width:1.5}
      .gw{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.5}
      .cl{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}
      .sync{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .async{stroke:#c2410c;stroke-width:1.8;fill:none;stroke-dasharray:6 4;marker-end:url(#ao)}
      .data{stroke:#16a34a;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .b{fill:#0f172a}
      .n{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1180" height="780" fill="#ffffff"/>
  <text x="30" y="34" style="font-size:20px;font-weight:700;fill:#0f172a">SuperTickets: system design</text>

  <!-- Browser -->
  <rect class="cl" x="490" y="50" width="200" height="54" rx="10"/>
  <text class="t" x="590" y="74" text-anchor="middle">Browser</text>
  <text class="s" x="590" y="92" text-anchor="middle">React SPA (cart in localStorage)</text>

  <!-- Gateway -->
  <rect class="gw" x="200" y="140" width="780" height="64" rx="10"/>
  <text class="t" x="590" y="165" text-anchor="middle">nginx gateway :8080 (only entry point)</text>
  <text class="s" x="590" y="186" text-anchor="middle">API gateway: path routing · rate limit 50 rps → 429   |   load balancer: round-robin over Catalog replicas</text>
  <path class="sync" d="M590 104 V140"/>

  <!-- Services -->
  <rect class="svc" x="40" y="270" width="300" height="76" rx="10"/>
  <text class="t" x="190" y="296" text-anchor="middle">Catalog.Api × 2 replicas</text>
  <text class="s" x="190" y="316" text-anchor="middle">events CRUD/search · cache-aside</text>
  <text class="s" x="190" y="332" text-anchor="middle">admin API key</text>

  <rect class="svc" x="400" y="270" width="240" height="76" rx="10"/>
  <text class="t" x="520" y="296" text-anchor="middle">Inventory.Api</text>
  <text class="s" x="520" y="316" text-anchor="middle">atomic reserve / release</text>
  <text class="s" x="520" y="332" text-anchor="middle">idempotent by orderId</text>

  <rect class="svc" x="780" y="270" width="280" height="76" rx="10"/>
  <text class="t" x="920" y="296" text-anchor="middle">Order.Api</text>
  <text class="s" x="920" y="316" text-anchor="middle">idempotent create · outbox publisher</text>
  <text class="s" x="920" y="332" text-anchor="middle">sweeper expires stale pending orders</text>

  <!-- gateway to services -->
  <path class="sync" d="M190 204 V270"/>
  <text class="l" x="198" y="238">/events, /admin</text>
  <path class="sync" d="M520 204 V270"/>
  <text class="l" x="528" y="238">/events/{id}/availability</text>
  <path class="sync" d="M920 204 V270"/>
  <text class="l" x="928" y="238">/orders</text>

  <!-- service to service -->
  <path class="sync" d="M340 308 H400"/>
  <text class="l" x="344" y="298" style="font-size:10px">PUT capacity</text>
  <path class="sync" d="M780 308 H640"/>
  <text class="l" x="652" y="298" style="font-size:10px">reserve</text>
  <circle class="b" cx="710" cy="326" r="9"/><text class="n" x="710" y="330">2</text>
  <text class="s" x="645" y="364">timeout · retry · circuit breaker</text>

  <!-- Data stores -->
  <rect class="db" x="40" y="440" width="120" height="58" rx="10"/>
  <text class="t" x="100" y="466" text-anchor="middle">Redis</text>
  <text class="s" x="100" y="484" text-anchor="middle">event cache, TTL±10%</text>
  <rect class="db" x="190" y="440" width="150" height="58" rx="10"/>
  <text class="t" x="265" y="466" text-anchor="middle">Postgres</text>
  <text class="s" x="265" y="484" text-anchor="middle">db: catalog</text>
  <rect class="db" x="400" y="440" width="240" height="58" rx="10"/>
  <text class="t" x="520" y="466" text-anchor="middle">Postgres</text>
  <text class="s" x="520" y="484" text-anchor="middle">db: inventory (stock, reservations)</text>
  <rect class="db" x="780" y="440" width="140" height="58" rx="10"/>
  <text class="t" x="850" y="466" text-anchor="middle">Postgres</text>
  <text class="s" x="850" y="484" text-anchor="middle">db: orders + outbox</text>
  <path class="data" d="M110 346 V440"/>
  <path class="data" d="M250 346 V440"/>
  <path class="data" d="M520 346 V440"/>
  <path class="data" d="M810 346 V440"/>

  <!-- RabbitMQ -->
  <rect class="mq" x="950" y="420" width="200" height="96" rx="10"/>
  <text class="t" x="1050" y="445" text-anchor="middle">RabbitMQ</text>
  <text class="s" x="1050" y="463" text-anchor="middle">topic exchange supertickets-events</text>
  <text class="s" x="1050" y="479" text-anchor="middle">payment-queue · notification-queue</text>
  <text class="s" x="1050" y="495" text-anchor="middle">quorum queues + DLQ per queue</text>
  <path class="async" d="M1010 346 V420"/>
  <circle class="b" cx="1010" cy="384" r="9"/><text class="n" x="1010" y="388">4</text>
  <text class="l" x="1018" y="404" style="font-size:10px">outbox publisher</text>
  <circle class="b" cx="810" cy="394" r="9"/><text class="n" x="810" y="398">3</text>
  <text class="l" x="822" y="398" style="font-size:10px">OrderCreated in outbox (same tx)</text>

  <!-- Worker -->
  <rect class="svc" x="780" y="590" width="370" height="76" rx="10"/>
  <text class="t" x="965" y="616" text-anchor="middle">Worker (BackgroundService)</text>
  <text class="s" x="965" y="636" text-anchor="middle">payment handler (simulated) · notification handler</text>
  <text class="s" x="965" y="652" text-anchor="middle">writes orders DB via Order.Data · creates tickets</text>
  <path class="async" d="M1050 516 V590"/>
  <circle class="b" cx="1050" cy="553" r="9"/><text class="n" x="1050" y="557">5</text>
  <text class="l" x="1062" y="548" style="font-size:10px">consume / ack</text>
  <path class="data" d="M870 590 V498"/>
  <text class="l" x="878" y="560" style="font-size:10px">paid/cancelled, tickets</text>
  <path class="sync" d="M780 628 H610 V346"/>
  <text class="l" x="620" y="612" style="font-size:10px">release stock on payment failure</text>

  <!-- Step 1 badge on gateway to order -->
  <circle class="b" cx="905" cy="226" r="9"/><text class="n" x="905" y="230">1</text>
  <circle class="b" cx="800" cy="692" r="9"/><text class="n" x="800" y="696">6</text>
  <text class="s" x="814" y="696">PaymentSucceeded → notification-queue</text>

  <!-- Legend / flow -->
  <rect class="cl" x="40" y="540" width="520" height="210" rx="10" style="fill:#f8fafc"/>
  <text class="h" x="58" y="566">Purchase flow</text>
  <g class="s">
    <text x="58" y="590">1  SPA → gateway → POST /orders (Idempotency-Key header)</text>
    <text x="58" y="610">2  Order saves "pending", reserves stock in Inventory (sync HTTP)</text>
    <text x="58" y="630">3  Order writes OrderCreated to the outbox in the same transaction</text>
    <text x="58" y="650">4  Outbox publisher sends it to RabbitMQ → payment-queue</text>
    <text x="58" y="670">5  Worker pays (simulated): paid, or cancelled + stock released</text>
    <text x="58" y="690">6  PaymentSucceeded → notification-queue → tickets created</text>
    <text x="58" y="710">7  SPA polls GET /orders/{id} until status is not "pending"</text>
  </g>
  <text class="s" x="58" y="736" style="font-style:italic">Lost message or crash? The sweeper cancels stale pending orders.</text>

  <!-- Legend arrows -->
  <path class="sync" d="M850 28 H900"/><text class="l" x="908" y="32">sync HTTP / SQL</text>
  <path class="async" d="M850 50 H900"/><text class="l" x="908" y="54">async message</text>
  <path class="data" d="M850 72 H900"/><text class="l" x="908" y="76">DB access</text>
</svg>
