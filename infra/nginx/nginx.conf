# Local API gateway + load balancer. Keep in sync with contracts.md#routing.
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's embedded DNS; re-resolve service names so replicas can come and go.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Same limits the project documents for the gateway: 50 rps, burst 100.
  limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Docker DNS returns every replica for a service name; nginx resolves it once per `valid` window.
  # `zone` + `resolve` makes the upstream follow DNS and round-robin across replicas.
  upstream catalog   { zone catalog 64k;   server catalog-api:8080   resolve; }
  upstream inventory { zone inventory 64k; server inventory-api:8080 resolve; }
  upstream orders    { zone orders 64k;    server order-api:8080     resolve; }

  server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    add_header X-Upstream $upstream_addr always;

    # Availability is served by Inventory (must come before the Catalog /events routes).
    location ~ ^/events/[^/]+/availability$ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://inventory;
    }

    location /events { limit_req zone=api burst=100 nodelay; proxy_pass http://catalog; }
    location /admin  { limit_req zone=api burst=100 nodelay; proxy_pass http://catalog; }
    location /orders { limit_req zone=api burst=100 nodelay; proxy_pass http://orders; }

    # /inventory/* is internal only: never proxied.
    location /inventory { return 404; }

    # Everything else is the SPA (Vite dev server, with websocket upgrade for HMR).
    # Any proxy_set_header here drops the server-level ones, so repeat them: Vite rejects Host "web".
    location / {
      set $web http://web:5173;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass $web;
    }
  }
}
